[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaanisetu"
version = "1.0.0"
description = "iTantra — Offline AI OS & Neural Transceiver Tactical Walkie-Talkie for 10 Indic Languages"
authors = [{ name = "Vaibhav Krishna Kesarwani" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "aiohttp>=3.9.0",
    "soundfile>=0.12.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
